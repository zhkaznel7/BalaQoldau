name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DB_SSL_MODE: disable
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/balaqoldau_test
      RELEASE_SCAN_CANARY: private-build-environment-must-not-be-bundled
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: balaqoldau_test
          # Ephemeral CI only; loopback port, no production data or secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d balaqoldau_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Source, license and append-only migration policy
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release.mjs --source
      - name: Release security tests
        run: node --test scripts/*.test.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --prefix balaqoldau --ignore-scripts --no-audit --fund=false
          npm ci --prefix backend --ignore-scripts --no-audit --fund=false
      - name: Frontend checks
        run: |
          npm run lint --prefix balaqoldau
          npm run typecheck --prefix balaqoldau
          npm test --prefix balaqoldau
          npm run build --prefix balaqoldau
      - name: Backend checks
        run: |
          npm run lint --prefix backend
          npm run typecheck --prefix backend
          npm test --prefix backend
      - name: Migrate isolated CI database twice
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/balaqoldau_test
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Database integration tests
        run: npm run test:db --prefix backend
      - name: User account database security tests
        run: npm run test:user-db --prefix backend
      - name: Dependency audits (production high/critical gate)
        run: node scripts/audit-dependencies.mjs
      - name: Check actual production artifacts
        run: node scripts/check-release.mjs --artifacts
